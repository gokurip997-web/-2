<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دراسات تالتة إعدادي 2027</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2a41;--mut:#5d6b82;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#dbe3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--tx:#e8eefb;--mut:#9aa8c4;--pri:#5b8cff;--bd:#2a3858;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--tx:#e8eefb;--mut:#9aa8c4;--pri:#5b8cff;--bd:#2a3858;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
.wrap{max-width:760px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:19px;margin:0}h3{color:var(--pri);margin:14px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.tabs{display:flex;gap:8px}.tabs .btn{flex:1}
.tabs .btn:not(.on){background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{cursor:pointer;text-align:center;margin:0}.unit b{display:block;color:var(--pri)}
.tag{font-size:12px;color:var(--mut)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:10px 0}
.opt{display:block;width:100%;text-align:right;margin:8px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
ul{padding-inline-start:20px;margin:4px 0}.center{text-align:center}
.credit{text-align:center;font-weight:bold;padding:10px;border-radius:12px;color:#fff;background:linear-gradient(90deg,#2563eb,#9333ea,#ec4899,#2563eb);background-size:300% 100%;animation:sh 6s linear infinite,pop .7s both;margin-bottom:6px}
@keyframes sh{to{background-position:300% 0}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes flt{50%{transform:translateY(-5px)}}
#app>*{animation:up .5s both}#app>*:nth-child(2){animation-delay:.1s}#app>*:nth-child(3){animation-delay:.2s}
.grid>.unit{animation:up .55s both}.grid>.unit:nth-child(2){animation-delay:.1s}.grid>.unit:nth-child(3){animation-delay:.2s}.grid>.unit:nth-child(4){animation-delay:.3s}
.card,.btn,.opt{transition:transform .2s,box-shadow .2s}
.unit:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 10px 24px rgba(37,99,235,.28)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(37,99,235,.3)}
.btn:active,.opt:active{transform:scale(.95)}
.opt:hover{transform:translateX(-5px)}
.opt.ok{animation:pulse .5s}.opt.bad{animation:shake .4s}
.center h1,.center h2{animation:pop .6s both}
header h1{animation:flt 3s ease-in-out infinite}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 20% 30%,rgba(37,99,235,.2),transparent 40%),radial-gradient(circle at 80% 70%,rgba(236,72,153,.18),transparent 40%),radial-gradient(circle at 60% 10%,rgba(147,51,234,.15),transparent 35%);animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(7%,-7%) rotate(10deg) scale(1.2)}}
@keyframes zin{0%{opacity:0;transform:scale(.6) translateY(30px)}60%{transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(37,99,235,.18),0 0 22px rgba(37,99,235,.55)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
#app>*{animation:zin .65s cubic-bezier(.34,1.56,.64,1) both}
.grid>.unit{animation:zin .7s cubic-bezier(.34,1.56,.64,1) both}
.btn,.opt,.unit{position:relative;overflow:hidden}
.btn:not(.sec){animation:glow 2.2s ease-in-out infinite}
.btn:hover{transform:translateY(-3px) scale(1.08) rotate(-1deg)}
.btn:active,.opt:active,.unit:active{transform:scale(.88)}
.tabs .btn.on{animation:glow 2s infinite,bob 2.5s ease-in-out infinite}
.unit:hover{transform:translateY(-8px) scale(1.06) rotate(1.5deg);box-shadow:0 14px 30px rgba(37,99,235,.4)}
.unit b{transition:letter-spacing .3s}.unit:hover b{letter-spacing:2px}
.opt:hover{transform:translateX(-10px) scale(1.03);border-color:var(--pri)}
.opt.ok{animation:pulse .6s 2}.opt.bad{animation:shake .5s}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;animation:rp .6s ease-out forwards}
.cf{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:99;animation:cf 1.1s ease-out forwards}
@media (prefers-reduced-motion:reduce){*,body::before{animation:none!important;transition:none!important}.cf{display:none}}
</style>
</head>
<body>
<div class="wrap"><div class="credit">✨ مصنوع بواسطة أحمد شريف أحمد محمد ✨</div><div id="app"></div></div>
<script>
const U=[
{n:1,s:"جغرافيا",t:"الملامح الطبيعية والحضارية لقارات العالم الجديد",L:[
["الدرس الأول: موقع ومظاهر سطح قارات العالم الجديد",["قارات العالم الجديد: أمريكا الشمالية وأمريكا الجنوبية وأستراليا.","أمريكا الشمالية: جبال الروكي غربًا وجبال الأبلاش شرقًا، وبينهما السهول الوسطى والبحيرات العظمى.","أمريكا الجنوبية: جبال الأنديز غربًا (أطول سلسلة جبلية في العالم) ونهر الأمازون وهضبة البرازيل.","أستراليا: أصغر القارات، وتشتهر بالحاجز المرجاني العظيم.","الموقع الفلكي: أمريكا الشمالية بين المحيطين الهادئ غربًا والأطلنطي شرقًا ويمر بها مدار السرطان، وأمريكا الجنوبية يقطعها خط الاستواء، وأستراليا بين المحيطين الهندي والهادئ.","المظاهر: الجبال الحديثة (الروكي والأنديز) تمتد غربًا على ساحل المحيط الهادئ، والسهول والهضاب في الوسط والشرق."]],
["الدرس الثاني: الحضارات القديمة في الأمريكتين",["المايا: في المكسيك وأمريكا الوسطى، وعرفوا التقويم والكتابة الهيروغليفية.","الأزتك: في المكسيك وعاصمتهم تينوختيتلان.","الإنكا: في بيرو بجبال الأنديز، وأشهر آثارهم مدينة ماتشو بيتشو.","تميزت هذه الحضارات بزراعة الذرة والبطاطس وبناء الأهرامات المدرجة والمعابد، وبرع المايا في الفلك والرياضيات.","سقطت على يد الغزو الإسباني في القرن 16: هزم كورتيس الأزتك (1521) وهزم بيزارو الإنكا (1533)."]],
["الدرس الثالث: الكشوف الجغرافية لقارات العالم الجديد",["كريستوفر كولمبس وصل إلى جزر الكاريبي عام 1492 برعاية إسبانيا وظنها الهند.","أمريجو فسبوتشي: أدرك أنها قارة جديدة، ومنه جاء اسم أمريكا.","ماجلان: قاد أول رحلة حول العالم (1519–1522).","جيمس كوك: استكشف شرق أستراليا عام 1770.","أسباب الكشوف: البحث عن طريق جديد للهند والتوابل بعد سقوط القسطنطينية 1453، والرغبة في الذهب والثروة ونشر المسيحية.","ما ساعد عليها: البوصلة والإسطرلاب وتطور السفن.","نتائجها: اتساع المعرفة بالعالم، وقيام المستعمرات الأوروبية، وانتقال المحاصيل كالبطاطس والذرة إلى أوروبا."]]],
Q:[["أطول سلسلة جبلية في العالم:",["الروكي","الأنديز","الأبلاش"],1],["أصغر القارات:",["أستراليا","أمريكا الجنوبية","أمريكا الشمالية"],0],["حضارة الإنكا قامت في:",["بيرو","مصر","اليابان"],0],["وصل كولمبس إلى جزر الكاريبي عام:",["1492","1805","1882"],0],["أول من قاد رحلة حول العالم:",["ماجلان","جيمس كوك","فسبوتشي"],0]]},
{n:2,s:"تاريخ",t:"مصر في عصر محمد علي وخلفائه",L:[
["الدرس الأول: تولية محمد علي حكم مصر وتثبيت دعائم حكمه",["اختاره العلماء بزعامة عمر مكرم واليًا على مصر عام 1805، وأقرّه السلطان العثماني.","هزم حملة فريزر الإنجليزية في رشيد عام 1807.","تخلص من المماليك في مذبحة القلعة عام 1811.","جاء محمد علي ألباني الأصل ضمن القوات العثمانية بعد خروج الحملة الفرنسية، وتميّز بذكائه فاكتسب ثقة الشعب.","نفى عمر مكرم إلى دمياط عندما زاد نفوذه الشعبي، فانفرد بالحكم وبدأ مشروع بناء دولة قوية."]],
["الدرس الثاني: محمد علي وبناء الدولة الحديثة في مصر",["الجيش: أسس جيشًا نظاميًا بالتجنيد الإجباري للمصريين.","الزراعة: أقام القناطر الخيرية وزرع القطن طويل التيلة.","التعليم: أنشأ مدرسة الطب (1827) ومدرسة الألسن (1835) وأرسل البعثات إلى أوروبا.","نظّم أسرته الحاكمة بحكم وراثي بموجب فرمان 1841.","الصناعة: أنشأ مصانع الغزل والنسيج والأسلحة والسفن لتوفير احتياجات الجيش.","الفتوحات: قاد ابنه إبراهيم باشا الجيش في السودان والحجاز والشام، وانتصر في قونية 1832 وعُقدت معاهدة كوتاهية 1833.","تدخلت الدول الأوروبية فعُقدت معاهدة لندن 1840 التي قلّصت الجيش المصري إلى 18 ألف جندي."]],["◀ حروب محمد علي بأمر السلطان العثماني (واليًا تابعًا له)",["أولًا: حرب الوهابيين في الحجاز (1811–1818)","السبب: سيطر الوهابيون (الدولة السعودية الأولى) على مكة والمدينة ومنعوا الحجاج، فأمر السلطان محمود الثاني محمد علي بإخضاعهم لأن مصر أقوى ولاياته.","الأحداث: أرسل ابنه طوسون (1811) فهُزم في الصفراء ثم استعاد المدينة (1812)، وسافر محمد علي بنفسه (1813) وحرر مكة، ثم أكمل إبراهيم باشا الحرب حتى سقطت الدرعية عام 1818.","النتائج: القضاء على الدولة السعودية الأولى، وضم الحجاز لنفوذ مصر، وارتفاع مكانة محمد علي في العالم الإسلامي.","ثانيًا: حرب المورة (اليونان) (1824–1827)","السبب: ثار اليونانيون على الحكم العثماني (1821)، فعجز السلطان عن إخماد الثورة واستعان بمحمد علي مقابل وعده بكريت والمورة (وكان قد أخضع كريت قبلها بأمر السلطان).","الأحداث: أرسل إبراهيم باشا بالأسطول المصري (1824) وانتصر في المورة، فتدخلت بريطانيا وفرنسا وروسيا لنصرة اليونان وحطمت الأسطول المصري العثماني في معركة نافارين (1827).","النتائج: ضاع الأسطول المصري، واستقلت اليونان (1830)، ولم يكافئه السلطان كما وعد إلا بكريت، فزاد استياء محمد علي وتحول نظره إلى الشام."]],["◀ حروب محمد علي لحسابه (ضد السلطان)",["أولًا: حرب الشام الأولى (1831–1833)","السبب: رفض السلطان منحه الشام مكافأة له، وخلافه مع والي عكا الذي آوى الفلاحين الهاربين من مصر، فاتخذه ذريعة للحرب.","الأحداث: حاصر إبراهيم باشا عكا حتى سقطت (1832)، ثم هزم العثمانيين في حمص وبيلان، وانتصر في قونية (ديسمبر 1832) وأسر الصدر الأعظم، وتقدم نحو الأناضول.","النتائج: صلح كوتاهية (1833): حصل محمد علي على الشام وأضنة مع كريت والحجاز، وأصبحت دولته أقوى من الدولة العثمانية.","ثانيًا: حرب الشام الثانية (1839–1841)","السبب: أراد السلطان محمود الثاني استرداد الشام فبدأ الهجوم، وخشيت أوروبا من قيام دولة قوية في الشرق تهدد طريق الهند.","الأحداث: انتصر إبراهيم في نصيبين (1839) وانضم الأسطول العثماني إلى الإسكندرية، فتدخلت الدول الأوروبية وعقدت معاهدة لندن (1840) وأنذرت محمد علي بالانسحاب، فلما رفض ضرب الأسطول البريطاني بيروت وعكا.","النتائج: اضطر محمد علي للانسحاب من الشام (1841)، وحصل على حكم مصر الوراثي لأسرته بفرمان 1841، وقُلّص جيشه إلى 18 ألف جندي، وفتحت أسواق مصر للتجارة الأجنبية."]],["◀ السودان (للاطلاع فقط – مش مطلوب في الامتحان)",["السبب: الحصول على الرجال للجيش والذهب والثروات، والقضاء على فلول المماليك الهاربين إليه، وتأمين حدود مصر الجنوبية ومنابع النيل.","الأحداث: خرجت الحملة عام 1820 بقيادة إسماعيل (ابن محمد علي) وضمت النوبة وسنار، وأخضع الدفتردار كردفان، وأُسست الخرطوم لتكون عاصمة للسودان.","النتائج: ضم السودان لمصر، لكن فشل الاعتماد على الجنود السودانيين في الجيش، وقُتل إسماعيل في شندي (1822)."]],
["الدرس الثالث: مصر في عهد خلفاء محمد علي",["عباس الأول (1848–1854) ثم سعيد (1854–1863) الذي منح امتياز قناة السويس لديليسبس.","إسماعيل (1863–1879): افتُتحت القناة في عهده عام 1869، وتراكمت الديون وانتهى بخلعه.","تولى بعده توفيق عام 1879.","عباس الأول: بدأ في عهده إنشاء أول خط سكة حديد بين الإسكندرية والقاهرة.","إسماعيل: حصل على لقب الخديوي (1867) وأنشأ مجلس شورى النواب (1866) ودار الأوبرا (1869).","بسبب الديون فُرضت الرقابة الثنائية (إنجليزية وفرنسية) على مالية مصر عام 1876، ثم خُلع إسماعيل."]]],
Q:[["اختار العلماء محمد علي واليًا عام:",["1805","1919","1952"],0],["مذبحة القلعة كانت ضد:",["المماليك","الفرنسيين","الإنجليز"],0],["أُنشئت مدرسة الألسن عام:",["1835","1952","1869"],0],["أُعطي امتياز قناة السويس في عهد:",["سعيد","عباس الأول","توفيق"],0],["افتُتحت قناة السويس في عهد:",["إسماعيل","محمد علي","سعيد"],0],["عُقدت معاهدة كوتاهية عام:",["1833","1840","1805"],0],["دُمر الأسطول المصري في معركة:",["نافارين","قونية","نصيبين"],0],["حارب محمد علي الوهابيين بأمر:",["السلطان العثماني","الإنجليز","الفرنسيين"],0],["انتصر إبراهيم باشا على العثمانيين في معركة:",["قونية","نافارين","التل الكبير"],0]]},
{n:3,s:"جغرافيا",t:"النظم البيئية في قارات العالم الجديد",L:[
["الدرس الأول: نظم الغابات والحشائش في قارات العالم الجديد",["الغابات الاستوائية المطيرة: في حوض الأمازون وتتميز بالمطر والحرارة طول العام.","غابات الصنوبر (التايجا): في شمال كندا.","الحشائش: البراري في أمريكا الشمالية، والبامبا في الأرجنتين، والسافانا والداونز في أستراليا.","المناخ: الغابات الاستوائية حارة مطيرة طول العام، والصنوبرية باردة طويلة الشتاء، والحشائش معتدلة قليلة المطر.","الحيوانات: في الأمازون الجاكوار والأناكوندا، وفي أستراليا الكنغر والكوالا.","الأهمية: الغابات مصدر للأخشاب والأكسجين، والحشائش مراعٍ للماشية وأراضٍ لزراعة القمح."]],
["الدرس الثاني: النظم البيئية الصحراوية والمائية",["صحراء أتاكاما في تشيلي من أكثر صحارى العالم جفافًا.","صحراء موهافي وسونورا في أمريكا الشمالية، والصحراء الوسطى في أستراليا.","النظم المائية: البحيرات العظمى ونهر الأمازون والحاجز المرجاني العظيم.","سبب الجفاف: تيار همبولت البارد يمنع المطر فتجف أتاكاما، وبعض الصحارى تقع خلف جبال تحجز الأمطار.","النباتات الصحراوية كالصبار تخزّن الماء، والحيوانات تنشط ليلًا لتتجنب الحرارة.","الأمازون أكبر نهر في العالم تصريفًا للمياه، والحاجز المرجاني أكبر نظام مرجاني في العالم قبالة شمال شرق أستراليا."]],
["الدرس الثالث: التغير المناخي وتأثيره على النظم البيئية",["السبب: زيادة الغازات الدفيئة مثل ثاني أكسيد الكربون فتحدث ظاهرة الاحتباس الحراري.","الآثار: ذوبان الجليد وارتفاع منسوب البحار وحرائق الغابات وإزالة الغابات.","الحلول: التشجير والطاقة النظيفة وترشيد استهلاك الطاقة.","الأسباب البشرية: حرق الوقود الأحفوري في المصانع والسيارات، وقطع الغابات التي تمتص الكربون.","الأثر: تغير مواعيد المطر وزيادة الجفاف والتصحر، وابيضاض الشعاب المرجانية.","اتفاقية باريس للمناخ (2015) اتفاق دولي لخفض الانبعاثات."]]],

const $=s=>document.querySelector(s);
const getName=()=>{let v="";try{v=localStorage.getItem("nm")||""}catch(e){}
 if(!v){try{const m=document.cookie.match(/(?:^|; )nm=([^;]*)/);if(m)v=decodeURIComponent(m[1])}catch(e){}}return v};
const setName=v=>{try{localStorage.setItem("nm",v)}catch(e){}
 try{document.cookie="nm="+encodeURIComponent(v)+"; max-age=31536000; path=/; SameSite=Lax"}catch(e){}};
let name=getName();
const app=$("#app");
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const head=()=>`<header><h1>📚 دراسات تالتة إعدادي ٢٠٢٧</h1><button class="btn sec" onclick="welcome(true)">👤 ${name}</button></header>`;
function welcome(change){
 app.innerHTML=`<div class="card center"><h1 style="margin-bottom:8px">أهلًا بيك 👋</h1><p>${change?"تحب تغيّر اسمك؟":"اكتب اسمك مرة واحدة بس عشان نبدأ المذاكرة"}</p><input id="nm" placeholder="اسمك هنا" value="${change?name:""}" maxlength="30"><button class="btn" onclick="saveName()">${change?"حفظ":"يلا نبدأ"}</button> ${change?'<button class="btn sec" onclick="home(\'learn\')">إلغاء</button>':""}</div>`;
 $("#nm").onkeydown=e=>{if(e.key==="Enter")saveName()}}
function saveName(){const v=$("#nm").value.trim();if(!v)return $("#nm").focus();name=v;setName(v);home("learn")}
function home(tab){
 const learn=tab==="learn";
 app.innerHTML=head()+`<div class="card center">أهلًا يا <b>${name}</b> 🌟 اختار اللي تحب تبدأ بيه</div>
 <div class="tabs"><button class="btn ${learn?"on":""}" onclick="home('learn')">📖 شرح</button><button class="btn ${learn?"":"on"}" onclick="home('play')">🎮 لعب</button></div>
 <div class="grid" style="margin-top:12px">${U.map((u,i)=>`<div class="card unit" onclick="${learn?`lesson(${i})`:`quiz([${i}],false)`}"><b>الوحدة ${u.n}</b>${u.t}<div class="tag">${u.s}</div></div>`).join("")}</div>
 ${learn?"":`<div class="card center"><b>📝 امتحان شامل</b><p class="tag">اختار الوحدة اللي عايز تمتحن فيها</p><div class="grid">${U.map((u,i)=>`<button class="btn sec" onclick="quiz([${i}],true)">الوحدة ${u.n}</button>`).join("")}</div><button class="btn" style="margin-top:10px;width:100%" onclick="quiz([0,1,2,3],true)">كل الوحدات</button></div>`}`}
function lesson(i){const u=U[i];
 app.innerHTML=head()+`<div class="card"><span class="tag">${u.s} – الوحدة ${u.n}</span><h2>${u.t}</h2>${u.L.map(l=>`<h3>${l[0]}</h3><ul>${l[1].map(x=>`<li>${x}</li>`).join("")}</ul>`).join("")}</div>
 <button class="btn" onclick="quiz([${i}],false)">🎮 جرّب نفسك</button> <button class="btn sec" onclick="home('learn')">رجوع</button>`}
function quiz(ids,exam){
 const qs=shuf(ids.flatMap(i=>U[i].Q.map(q=>({q:q[0],o:q[1],a:q[2]}))));
 let k=0,sc=0,done=false;
 const show=()=>{
  if(k>=qs.length){const p=Math.round(sc/qs.length*100);
   if(p>=50)setTimeout(()=>conf(innerWidth/2,innerHeight/3,90,380),250);return app.innerHTML=head()+`<div class="card center"><h2>${p>=85?"🏆":p>=50?"👏":"💪"} خلصت يا ${name}!</h2><h1>${sc} / ${qs.length}</h1><p>${p>=85?"ممتاز! أنت جاهز":p>=50?"كويس، راجع الشرح وحاول تاني":"محتاج مراجعة بسيطة، ارجع للشرح"}</p><button class="btn" onclick="home('play')">رجوع</button></div>`}
  const c=qs[k];const os=shuf(c.o.map((t,i)=>({t,r:i===c.a})));
  app.innerHTML=head()+`<div class="card"><div class="tag">${exam?"امتحان شامل":"تدريب"} – سؤال ${k+1} من ${qs.length}</div><div class="bar"><i style="width:${k/qs.length*100}%"></i></div><h3>${c.q}</h3>${os.map((x,i)=>`<button class="opt" data-i="${i}">${x.t}</button>`).join("")}</div>`;
  done=false;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=true;const x=os[b.dataset.i];
   if(x.r){sc++;b.classList.add("ok");const r=b.getBoundingClientRect();conf(r.left+r.width/2,r.top+r.height/2,22,160)}else{b.classList.add("bad");app.querySelectorAll(".opt").forEach((bb,j)=>{if(os[j].r)bb.classList.add("ok")})}
   setTimeout(()=>{k++;show()},exam?700:1100)})};
 show()}
function conf(x,y,n,sp){const cs=["#2563eb","#ec4899","#f59e0b","#16a34a","#9333ea"];for(let i=0;i<n;i++){const s=document.createElement("span"),a=Math.random()*6.28,d=sp*(.4+Math.random()*.6);s.className="cf";s.style.cssText=`left:${x}px;top:${y}px;background:${cs[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d+60}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
document.addEventListener("click",e=>{const b=e.target.closest(".btn,.opt,.unit");if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
name?home("learn"):welcome();
</script>
